name: Variables Secrets and Artifacts

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

env:
  GLOBAL_VAR: "Global Level Variable"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "Job Level Variable"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials (LabRoles)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Application
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || 'https://api.example.com' }}

      - name: Use Variables and Secrets
        run: |
          echo "Global Var: $GLOBAL_VAR"
          echo "Job Var: $JOB_VAR"
          echo "Step Var: $STEP_VAR"
          echo "Repo Var: ${{ vars.REPO_VAR }}"
          echo "Secret (Masked): ${{ secrets.MY_SECRET }}"
          echo "AWS Region: $AWS_DEFAULT_REGION"
          echo "AWS Access Key (Masked): ${{ secrets.AWS_ACCESS_KEY_ID }}"
          echo "AWS Secret Key (Masked): ${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS Session Token (Masked): ${{ secrets.AWS_SESSION_TOKEN }}"
        env:
          STEP_VAR: "Step Level Variable"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: ./client/dist
          retention-days: 1

  download-and-verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./downloaded-client

      - name: Verify Artifact Content
        run: |
          ls -R ./downloaded-client
